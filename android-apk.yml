
name: VoxelCraft Alpha Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'VoxelCraft-Alpha-Remaster-BUILD-PREPARED.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract source archive
        run: |
          test -s VoxelCraft-Alpha-Remaster-BUILD-PREPARED.zip
          unzip -q VoxelCraft-Alpha-Remaster-BUILD-PREPARED.zip -d source
          test -f source/VoxelCraft-base/CMakeLists.txt
          test -f source/VoxelCraft-base/_optional/Android/gradlew
          echo "SOURCE_DIR=$GITHUB_WORKSPACE/source/VoxelCraft-base" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: source/VoxelCraft-base/_optional/Android/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-37" "build-tools;37.0.0" "ndk;30.0.16248370"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Build debug APKs
        working-directory: source/VoxelCraft-base/_optional/Android
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: List generated APKs
        if: always()
        run: |
          find source/VoxelCraft-base/_optional/Android/app/build/outputs/apk -type f -name '*.apk' -print 2>/dev/null || true

      - name: Upload APKs and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxelcraft-alpha-remaster-android
          path: |
            source/VoxelCraft-base/_optional/Android/app/build/outputs/apk/**/*.apk
            source/VoxelCraft-base/_optional/Android/native/build/outputs/**
          if-no-files-found: warn
          retention-days: 15
